<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Repet+</title>
    <link rel="stylesheet" href="Auth.css">
</head>
<body>
    <main class="login">
        <div class="section">
            <div class="logo">
                <a href="indexMain.html"><div class="logo-icon"><img src="images/Frame 20.png"></div></a>
            </div>

            <h1 class="title">Войти в личный<br>кабинет</h1>

            <form class="form">
                <div class="field-group">
                    <label class="label">Логин:</label>
                    <div class="login-input">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2">
                            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                            <circle cx="8.5" cy="10" r="1.5"></circle>
                            <path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L8 15.2"></path>
                        </svg>
                        <input type="text" placeholder="Введите номер или электронную почту">
                    </div>
                </div>

                <div class="field-group">
                    <label class="label">Пароль:</label>
                    <div class="login-input">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2">
                            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                            <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
                        </svg>
                        <input type="password" placeholder="qwerty123">
                    </div>
                </div>

                <a href="repets.html"><button type="submit" class="login-btn">Войти</button></a>
                <a href="Reg.html" class="register-link">Зарегистрироваться</a>
            </form>
        </div>
    </main>

    <script>
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
